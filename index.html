function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function actualDays(s,key){return Object.entries(s.days).filter(([date,foods])=>weekDates().includes(date)&&foods.some(n=>{let f=food(n);return f&&goalMatches(f,key)})).map(x=>x[0])}
function goalValue(s,key){return actualDays(s,key).length}
const adultAnimals={0:['🐄','🐑','🐓','🐖','🐐','🐎','🦆'],1:['🦒','🐙','🐕','🐈','🐗']};
function adultStatus(idx=active,k=weekKey()){
 if(people[idx].child)return null;
 let s=state(idx,k),diversity=new Set(migratedFoods(s).map(plantName).filter(Boolean)).size;
 let dates=weekDates(k);
 let allGoals=goals.every(g=>dates.filter(date=>(s.days?.[date]||[]).some(n=>{let f=food(n);return f&&goalMatches(f,g[1])})).length>=g[2]);
 let waterTarget=data.settings.waterMl[idx]||1800;
 let waterDone=dates.every(date=>(s.water?.[date]||0)>=waterTarget);
 if(diversity<30&&!(allGoals&&waterDone))return null;
 let pool=adultAnimals[idx];let hash=[...k].reduce((a,c)=>a+c.charCodeAt(0),0)+idx*7;
 return {animal:pool[hash%pool.length],reason:diversity>=30?'30 verschiedene Pflanzen':'alle Wochenziele'};
}
function setProfile(i){active=i;tab=people[i].child?'plants':'goals';query='';filter='Alle';render()}
function setTab(t){tab=t;render()}
function showPrize(prize,msg){document.getElementById('treasure').innerHTML=rewardVisual(prize);document.getElementById('message').textContent=msg;document.getElementById('overlay').classList.add('show')}
function addReward(s,kind,at){let prize=kind==='dodo'?'🦤':rewards[Math.floor(Math.random()*rewards.length)];s.rewards.push({at,prize,date:selectedDate,kind});return prize}
function toggleFood(n){let s=state(),arr=day(s,selectedDate),before=migratedFoods(s).map(plantName).filter(Boolean),old=new Set(before).size;if(arr.includes(n))s.days[selectedDate]=arr.filter(x=>x!==n);else arr.push(n);let newFoods=migratedFoods(s),newCount=new Set(newFoods.map(plantName).filter(Boolean)).size;let prize=null;if(people[active].child&&newCount>old){let milestone=Math.floor(newCount/3)*3;if(milestone>=3&&!s.rewards.some(r=>r.kind!=='dodo'&&r.at===milestone))prize=addReward(s,'plant',milestone)}save();render();if(prize)setTimeout(()=>showPrize(prize,'Du hast '+newCount+' unterschiedliche Pflanzen entdeckt! Dein Schatz bleibt erhalten.'),100)}
function setWater(delta){let s=state();s.water[selectedDate]=Math.max(0,(s.water[selectedDate]||0)+delta);save();render()}
function setWaterTarget(v){data.settings.waterMl[active]=Math.max(250,Math.min(5000,Number(v)||1800));save();render()}
function toggleSweet(){let s=state(),current=s.sweets[selectedDate];if(current){delete s.sweets[selectedDate]}else{s.sweets[selectedDate]=true;if(!s.rewards.some(r=>r.kind==='dodo'&&r.date===selectedDate)){let prize=addReward(s,'dodo',null);save();render();setTimeout(()=>showPrize(prize,'Ein besonderer Dodo-Schatz für deinen heutigen Tag!'),100);return}}save();render()}
function berryArt(name){let colors={'Heidelbeere':'#4e58a6','Himbeere':'#d93665','Brombeere':'#47294d','Erdbeere':'#e83f48'};let color=colors[name];if(!color)return null;let strawberry=name==='Erdbeere';let shapes=strawberry?'<path d="M28 15 C5 10 12 41 28 49 C45 37 51 10 28 15" fill="'+color+'"/><path d="M18 15 Q28 3 38 15 L29 12 L28 19 L23 12Z" fill="#439454"/>':Array.from({length:9},(_,i)=>`<circle cx="${16+i%3*11}" cy="${15+Math.floor(i/3)*11}" r="7.5" fill="${color}" stroke="white" stroke-width="1"/>`).join('');return `<svg viewBox="0 0 58 58" role="img" aria-label="${esc(name)}">${shapes}</svg>`}
function pic(f){return FOOD_PHOTOS[f[0]]?`<img src="${FOOD_PHOTOS[f[0]]}" alt="${esc(f[0])}" loading="lazy">`:berryArt(f[0])||`<span aria-hidden="true">${f[1]}</span><small>${esc(f[0].slice(0,6))}</small>`}
function selectedDayNav(){return `<div class="card"><div class="row"><strong>Einträge für</strong><select id="dayselect" class="select" style="width:auto">${weekDates().map((d,i)=>`<option value="${d}" ${selectedDate===d?'selected':''}>${['Mo','Di','Mi','Do','Fr','Sa','So'][i]} ${d.slice(8)}</option>`).join('')}</select></div><p class="muted">Wähle den Tag aus, an dem du etwas gegessen hast. Jedes Lebensmittel kann an mehreren Tagen eingetragen werden, zählt für die Pflanzenvielfalt aber nur einmal.</p></div>`}
function render(){if(!weekDates().includes(selectedDate))selectedDate=weekDates()[0];let p=people[active],s=state();document.getElementById('profiles').innerHTML=people.map((x,i)=>`<button data-profile="${i}" class="${i===active?'active':''}"><span class="face">${x.emoji}</span>${x.name}${!x.child&&adultStatus(i)?` <span title="Wochenbelohnung">${adultStatus(i).animal}</span>`:""}</button>`).join('');document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>setProfile(+b.dataset.profile));let tabs=p.child?[['plants','Entdecken'],['collection','Schätze'],['history','Verlauf']]:[['goals','Wochenziele'],['plants','Lebensmittel'],['history','Verlauf']];if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];document.getElementById('tabs').innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));let v=document.getElementById('view');
if(tab==='plants'){let eaten=migratedFoods(s),uniq=[...new Set(eaten.map(plantName).filter(Boolean))],pts=points(eaten),shown=allFoods().filter(f=>(filter==='Alle'||f[2]===filter)&&f[0].toLowerCase().includes(query.toLowerCase()));v.innerHTML=`<section class="card"><div class="row"><div><div class="muted">${p.name} · Woche ab ${weekKey()}</div><div class="big">${String(pts).replace('.',',')} <span class="muted">Pflanzenpunkte</span></div></div><span style="font-size:38px">${p.emoji}</span></div><div class="progress"><div class="bar" style="width:${Math.min(100,pts/30*100)}%"></div></div><p class="muted">${uniq.length} unterschiedliche Pflanzen · Kräuter/Gewürze ¼ Punkt. Milchprodukte und Eier zählen nicht als Pflanzen.</p>${p.child?'<div class="notice">🎁 Alle 3 neuen Pflanzen gibt es einen Schatz. Entdecke Neues in deinem Tempo!</div>':''}</section>${selectedDayNav()}<section class="card"><h2>Lebensmittel auswählen</h2><input id="search" class="input" placeholder="Suchen …" value="${esc(query)}"><div class="chips">${['Alle','Gemüse','Obst','Hülsenfrüchte','Getreide','Nüsse & Samen','Kräuter & Gewürze','Pilze','Pflanzendrinks','Milchprodukte','Weitere Proteine','Fermentiertes','Eigene Lebensmittel'].map(c=>`<button class="${filter===c?'active':''}" data-cat="${esc(c)}">${c}</button>`).join('')}</div><div class="searchlist">${shown.map(f=>`<div class="food"><div class="foodpic">${pic(f)}</div><div class="foodname"><strong>${esc(f[0])}</strong><div class="fact">${esc(f[3])}</div></div><button class="${day(s,selectedDate).includes(f[0])?'selected':''}" data-food="${esc(f[0])}">${day(s,selectedDate).includes(f[0])?'✓':'+'}</button></div>`).join('')||'<p class="muted">Kein Treffer – du kannst unten ein eigenes Lebensmittel hinzufügen.</p>'}</div></section><section class="card"><h2>Lebensmittel fehlt?</h2><p class="muted">Füge es selbst hinzu. Wähle die Kategorie und, wenn es sich um eine pflanzliche Zutat handelt, wird es für die Vielfalt berücksichtigt.</p><input id="newfood" class="input" maxlength="60" placeholder="Name, z. B. Pak Choi"><select id="newcat" class="select" style="margin-top:8px">${['Gemüse','Obst','Hülsenfrüchte','Getreide','Nüsse & Samen','Kräuter & Gewürze','Pilze','Pflanzendrinks','Milchprodukte','Weitere Proteine','Fermentiertes'].map(c=>`<option>${c}</option>`).join('')}</select><button id="addfood" style="margin-top:8px">Lebensmittel hinzufügen</button></section>`;document.getElementById('search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;render();let el=document.getElementById('search');el.focus();el.setSelectionRange(pos,pos)};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{filter=b.dataset.cat;render()});document.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>toggleFood(b.dataset.food));document.getElementById('addfood').onclick=()=>{let name=document.getElementById('newfood').value.trim(),cat=document.getElementById('newcat').value;if(!name)return alert('Bitte einen Namen eingeben.');if(allFoods().some(f=>f[0].toLowerCase()===name.toLowerCase()))return alert('Dieses Lebensmittel gibt es schon. Bitte über die Suche auswählen.');data.customFoods.push([name,'🍽️',cat,'Selbst hinzugefügt; Nährstoffangaben noch nicht geprüft.',null]);save();query=name;filter='Alle';render()}}
else if(tab==='goals'){let target=data.settings.waterMl[active]||1800,water=s.water[selectedDate]||0;v.innerHTML=`<section class="card"><h2>Wochenziele · ${p.name}</h2>${adultStatus()?`<div class="adult-award"><span>${adultStatus().animal}</span> Bravo! ${adultStatus().reason} erreicht. Dieses Tier begleitet dich diese Woche.</div>`:`<p class="reward-note">Wochenüberraschung: Erreiche 30 unterschiedliche Pflanzen oder alle Wochenziele einschließlich deines Trinkziels an 7 Tagen.</p>`}<p class="muted">Die Ziele werden automatisch aus deinen täglichen Lebensmitteleinträgen berechnet. Einträge aus älteren Versionen bleiben im Pflanzenverlauf, lassen sich aber nicht rückwirkend einem bestimmten Tag zuordnen.</p>${goals.map(g=>{let n=goalValue(s,g[1]);return `<div class="goal"><div class="row"><strong>${esc(g[0])}</strong><span>${n} / ${g[2]} ${g[3]}</span></div><div class="progress"><div class="bar" style="width:${Math.min(100,n/g[2]*100)}%"></div></div><p class="mini">${g[1]==='veg'?'Gemüse ist ein Tagesindikator, keine automatische Portionsmessung.':g[1]==='protein'?'Dazu zählen z. B. Tofu, Bohnen, Eier, Milchprodukte und Sojadrink.':'Ein Tag zählt, sobald ein passendes Lebensmittel erfasst wurde.'}</p></div>`}).join('')}</section>${selectedDayNav()}<section class="card"><h2>Trinken · Tagesziel</h2><p class="muted">Dein individuell einstellbarer Orientierungswert für Getränke, nicht für die gesamte Wasseraufnahme über Lebensmittel. Bei Krankheit, Sport oder besonderen Bedürfnissen kann der Bedarf abweichen.</p><div class="row"><label for="target">Ziel (ml/Tag)</label><input id="target" type="number" min="250" max="5000" step="100" class="input" style="width:110px" value="${target}"></div><div class="row" style="margin-top:12px"><strong>${water} / ${target} ml</strong><span><button id="minuswater">− 250 ml</button> <button id="pluswater">+ 250 ml</button></span></div><div class="progress"><div class="bar" style="width:${Math.min(100,water/target*100)}%"></div></div><p class="mini">Trinkmengen anderer Tage kannst du über die Tagesauswahl oben erfassen.</p></section><section class="card hint">Zum Erfassen von Gemüse, Obst, Proteinquellen usw. auf <strong>Lebensmittel</strong> tippen und einen Tag auswählen.</section>`;document.getElementById('target').onchange=e=>setWaterTarget(e.target.value);document.getElementById('minuswater').onclick=()=>setWater(-250);document.getElementById('pluswater').onclick=()=>setWater(250)}
else if(tab==='collection'){let list=s.rewards.map(r=>typeof r==='object'?r:{at:r,prize:'⭐',date:'',kind:'plant'});v.innerHTML=`<section class="card"><h2>Deine Schatzsammlung · ${p.name}</h2><p class="muted">Alle drei neuen Pflanzen gibt es einen Überraschungsschatz. Für einen freiwillig eingetragenen Tag ohne Süßigkeiten gibt es ein besonderes Überraschungsgeschenk.</p><div class="rewards">${list.map(r=>`<div class="prize">${rewardVisual(r.prize)}<small>${r.kind==='dodo'?'Besonderes Geschenk '+esc(r.date):'Bei '+r.at+' Pflanzen'}</small></div>`).join('')||'<p class="muted">Noch keine Schätze – entdecke drei Pflanzen!</p>'}</div></section>${selectedDayNav()}<section class="card"><h2>🎁 Besondere Tagesüberraschung</h2><p class="muted">Heute keine Bonbons, Schokolade oder Gummibärchen? Dann wartet eine besondere Überraschung auf dich. Müsli, Obst und Marmeladenbrot zählen hier nicht als Süßigkeiten. Das ist ein freiwilliges Spiel, keine Bewertung des Essens.</p><button id="sweet" class="${s.sweets[selectedDate]?'active':''}">${s.sweets[selectedDate]?'✓ Besonderer Tag eingetragen':'Überraschung freischalten'}</button><p class="mini">Die Überraschung bleibt auch dann in der Sammlung, wenn der Haken später korrigiert wird.</p></section>`;document.getElementById('sweet').onclick=toggleSweet}
else{let weeks=Object.keys(data.weeks).sort().reverse();v.innerHTML=`<section class="card"><h2>Verlauf · ${p.name}</h2>${weeks.map(k=>{let z=data.weeks[k][active];if(!z)return '';let rw=p.child?(z.rewards||[]).map(r=>rewardVisual(typeof r==='object'?r.prize:'⭐')).join(' '):'';return `<div class="food"><div class="foodname"><strong>Woche ab ${esc(k)}</strong><div class="fact">${new Set(migratedFoods(z).map(plantName).filter(Boolean)).size} Pflanzen · ${String(points(migratedFoods(z))).replace('.',',')} Punkte</div></div><span style="display:flex;flex-wrap:wrap;max-width:160px;gap:2px">${rw}</span></div>`}).join('')||'<p>Keine Einträge vorhanden.</p>'}<p class="muted">Die Sicherung enthält alle vier Profile und ihre Historie.</p><div class="actions"><button id="export">Daten sichern</button><label class="chip">Sicherung laden <input type="file" id="import" accept="application/json" style="display:none"></label></div></section>`;document.getElementById('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='pflanzenwoche-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('import').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!obj.weeks)throw Error();if(confirm('Gespeicherte Daten durch diese Sicherung ersetzen?')){data=obj;data.people=people;data.customFoods??=[];data.settings??={waterMl:[1800,1800]};save();render()}}catch(err){alert('Diese Sicherung konnte nicht gelesen werden.')}}}
let sel=document.getElementById('dayselect');if(sel)sel.onchange=e=>{selectedDate=e.target.value;render()};}
document.getElementById('dismiss').onclick=()=>document.getElementById('overlay').classList.remove('show');document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.target.classList.remove('show')};render();
</script></body></html>
